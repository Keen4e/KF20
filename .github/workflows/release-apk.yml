name: Publish PI APK release

on:
  push:
    branches: ["codex/kf20-rebuild"]
    paths:
      - "release/current.json"
      - ".github/workflows/release-apk.yml"

permissions:
  contents: write

concurrency:
  group: kf20-pi-release
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate server syntax and contracts
        working-directory: server
        run: |
          node --check src/server.js
          node --check src/providers/openai.js
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Assemble installable APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Read immutable release descriptor
        id: release
        working-directory: .
        shell: bash
        run: |
          TAG=$(node -p "require('./release/current.json').tag")
          TITLE=$(node -p "require('./release/current.json').title")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          node -p "require('./release/current.json').notes" > release-notes.txt
          cp android/app/build/outputs/apk/debug/app-debug.apk "KF20-$TAG.apk"
      - name: Publish GitHub prerelease
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          test -n "$RELEASE_TAG"
          test -n "$RELEASE_TITLE"
          gh release create "$RELEASE_TAG" "KF20-$RELEASE_TAG.apk" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.txt \
            --prerelease
